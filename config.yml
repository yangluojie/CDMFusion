data:
    dataset: "MSRS"
    image_size: 64  
    channels: 3
    num_workers: 32
    data_dir_for_train: None
    filelist_for_train : None
    data_dir_for_test: "/path/datasets/test/MSRS/test/"
    filelist_for_test: "test.txt"
    conditional: True

model:
    in_channels: 3
    out_ch: 3
    ch: 128
    ch_mult: [1, 2, 3, 4]
    num_res_blocks: 2
    attn_resolutions: [16, ]
    dropout: 0.0
    ema_rate: 0.999
    ema: True
    resamp_with_conv: True

diffusion:
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 1000

training:
    patch_n: 16
    batch_size: 1
    n_epochs: 2000
    n_iters: 10000000
    snapshot_freq: 10000
    validation_freq: 50000

sampling:
    batch_size: 1
    last_only: True

optim:
    weight_decay: 0.000
    optimizer: "Adam"
    lr: 0.00002
    amsgrad: False
    eps: 0.00000001
